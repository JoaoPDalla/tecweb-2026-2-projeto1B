{% load static %}


{% block content %}
<div class="appbar">
      <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

  <input type="submit" />

<main class="container">
      <form class="form-card" method="post">
        {% csrf_token %}
        <input
          class="form-card-title"
          type="text"
          name="titulo"
          placeholder="Título"
        />
        <textarea
          class="autoresize"
          name="detalhes"
          placeholder="Digite o conteúdo..."
        ></textarea>
        <button class="btn" type="submit">Criar</button>
      </form>
  

<div class="card-container">
  {% for note in notes %}
<div class="card">
    <h3 class="card-title">{{ note.title }}</h3>
    <form method ='post' action = "/notes/delete/{{note.id}}/">
                {% csrf_token %}         
                <button type = "submit">
                <img class = 'lixeira' src = "{% static 'notes/img/lixeira.jpg' %}">
                </button>
            </form>
            <a href="{% url 'update' note.id %}">
                <img class="lixeira" src="{% static 'notes/img/update.png' %}">
            </a>
    <div class="card-content">
      <p>
        {{ note.content }}
      </p>
    </div>
  </div>
  {% endfor %}
</div>

<!-- <ul>
  {% for note in notes %}
  <li>{{ note.title }} {{ note.content }}</li>
  {% endfor %}
</ul> -->
</main>
{% endblock %}
